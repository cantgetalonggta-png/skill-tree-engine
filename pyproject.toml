[project]
name = "skill-tree-engine"
version = "1.0.0"
description = "Hierarchical skill-tree engine over EXTRACT distilled skills"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ste-build = "skill_tree_engine.cli:main"
ste-serve = "skill_tree_engine.api:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
